name: Keep Render service awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    if: ${{ secrets.RENDER_HEALTH_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ping bot health endpoint
        run: curl --fail --silent --show-error --max-time 20 "$RENDER_HEALTH_URL/health"
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}