name: Keep Render service awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
    steps:
      - name: Ping bot health endpoint
        if: ${{ env.RENDER_HEALTH_URL != '' }}
        run: curl --fail --silent --show-error --max-time 20 "$RENDER_HEALTH_URL/health"
