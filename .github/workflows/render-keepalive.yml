name: Keep Render service awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
    steps:
      - name: Ping bot health endpoint every minute
        if: ${{ env.RENDER_HEALTH_URL != '' }}
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            curl --fail --silent --show-error --max-time 120 "$RENDER_HEALTH_URL/health" || echo "health ping $i failed; Render may be cold-starting"
            if [ "$i" != "5" ]; then sleep 60; fi
          done
