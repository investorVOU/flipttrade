services:
  - type: web
    runtime: node
    name: flipt-testnet-bot
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PRIVATE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: RPC_URL
        value: https://rpc.testnet.arc.network
      - key: DRY_RUN
        value: "false"
      - key: MAX_TOTAL_SPEND_USDC
        value: "500000"
      - key: MAX_CYCLES
        value: "0"
      - key: AUTO_BOND
        value: "true"
      - key: AUTO_UNBOND
        value: "true"
      - key: MAX_BOND_USDC
        value: "1"
      - key: BOND_TOKEN_PERCENT
        value: "10"
      - key: UNBOND_PERCENT
        value: "100"
      - key: UNBOND_AFTER_CYCLES
        value: "2"
      - key: MAX_BUY_USDC
        value: 50
      - key: MIN_BUY_USDC
        value: 10
